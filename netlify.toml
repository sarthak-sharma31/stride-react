# Hosting config for when the site is published (it is a single-page React app built by Vite).
[build]
  command = "node scripts/write-release.mjs && npx vite build"
  publish = "dist"

# The APK is hosted on GitHub Releases, so downloads don't use this site's bandwidth. The old
# link redirects there for build 8's updater and links shared earlier.
[[redirects]]
  from = "/download/StrideRewards.apk"
  to = "https://github.com/sarthak-sharma31/stride-react/releases/download/build-9/StrideRewards.apk"
  status = 302
  force = true

[[headers]]
  for = "/download/latest.json"
  [headers.values]
    Cache-Control = "no-cache"
    Access-Control-Allow-Origin = "*"

# The admin console is for the operator only; keep it out of search engines.
[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Every page is rendered by React; serve index.html for all routes (files above still win).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
